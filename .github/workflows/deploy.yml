name: Déployer le site

# Correspondance branche → environnement :
#   dev        → dev      (mc-launcher-dev.ggy.info)
#   main       → preprod  (mc-launcher-staging.ggy.info)
#   tag v*     → prod     (mc-launcher.ggy.info)
#
# Le site sert deux choses d'origines différentes : la page, versionnée ici, et
# le pack du launcher, venu de l'image mc-content. Sa version, et le fait même
# de le publier, sont donc choisis ici aussi, environnement par environnement,
# comme le namespace et les hôtes.
#
# Un seul niveau de sous-domaine, et ce n'est pas un choix esthétique : le
# certificat public de Cloudflare ne couvre que « ggy.info » et « *.ggy.info ».
# Tout nom à deux niveaux — preprod.mc-launcher.ggy.info, mc-launcher.staging
# .ggy.info — échoue en TLS côté visiteur, même si le certificat d'origine,
# lui, couvre *.dev et *.staging. Les couvrir au bord demanderait Advanced
# Certificate Manager, payant.
#
# La prod n'est jamais atteinte par un simple push : il faut poser un tag, ce
# que toi seul peux faire. C'est la barrière d'approbation du pauvre, les
# règles de protection d'environnement étant réservées au plan Enterprise.

on:
  push:
    branches: [main, dev]
    paths:
      - "chart/**"
      - ".github/workflows/deploy.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [dev, preprod, prod]
        default: dev

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      namespace: ${{ steps.map.outputs.namespace }}
      set: ${{ steps.map.outputs.set }}
      url: ${{ steps.map.outputs.url }}
      pack: ${{ steps.map.outputs.pack }}
    steps:
      - id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            ENV=prod
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            ENV=dev
          else
            ENV=preprod
          fi

          # PACK est le tag de l'image mc-content dont ce site publie /pack/.
          # PACK_ON dit si ce site le publie tout court.
          #
          # Dev et preprod suivent « main » : ce sont les environnements où l'on
          # essaie, et le pack y suit le contenu comme les serveurs le font.
          # Preprod n'a pas de serveur Minecraft derrière lui, ce qui ne change
          # rien ici — le launcher, lui, distingue bien ses environnements, et
          # une préproduction qui ne servirait pas de pack ne préparerait rien.
          #
          # Prod attend, et c'est le seul « false » de ce fichier : aucun tag de
          # mc-content ne porte encore launcher/, le v0.1.0 lui étant antérieur.
          # L'initContainer échouerait volontairement, ce qui est le
          # comportement voulu mais un piège inutile à armer d'avance. Pour
          # l'activer : poser un tag sur mc-content, le reporter ici en PACK, et
          # le faire correspondre à environments.prod.content.tag dans
          # mc-server — c'est là que se joue la concordance entre ce que le
          # client charge et ce que les serveurs installent.
          #
          # Jamais « main » en production : un tag mobile ferait changer le pack
          # au premier redéploiement venu, y compris subi.
          case "$ENV" in
            dev)
              NS=mc-dev;      HOSTS='{mc-launcher-dev.ggy.info}';     URL=https://mc-launcher-dev.ggy.info
              PACK=main;      PULL=Always;        PACK_ON=true ;;
            preprod)
              NS=mc-preprod;  HOSTS='{mc-launcher-staging.ggy.info}'; URL=https://mc-launcher-staging.ggy.info
              PACK=main;      PULL=Always;        PACK_ON=true ;;
            prod)
              NS=mc-prod; HOSTS='{mc-launcher.ggy.info,mc-luncher.ggy.info}'; URL=https://mc-launcher.ggy.info
              PACK=v0.1.0;    PULL=IfNotPresent;  PACK_ON=false ;;
          esac

          {
            echo "environment=$ENV"
            echo "namespace=$NS"
            echo "set=namespace=$NS,ingress.hosts=$HOSTS,pack.enabled=$PACK_ON,pack.tag=$PACK,pack.pullPolicy=$PULL"
            echo "url=$URL"
            echo "pack=$PACK_ON"
          } >> "$GITHUB_OUTPUT"
          if [ "$PACK_ON" = true ]; then
            echo "→ $ENV · namespace $NS · $URL · pack mc-content:$PACK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "→ $ENV · namespace $NS · $URL · pack NON publié ici" >> "$GITHUB_STEP_SUMMARY"
          fi

  # L'image mc-content est privée, et son tirage s'autorise par un Secret qui
  # vit dans le namespace. mc-dev et mc-prod l'ont parce que mc-server y vit ;
  # mc-preprod n'est occupé que par ce site et ne l'avait pas. L'initContainer y
  # restait en ImagePullBackOff, et « helm --atomic » annulait tout le
  # déploiement — la page avec.
  #
  # Ce job garantit sa présence avant de déployer. Il ne fabrique aucun
  # identifiant et n'en fait transiter aucun par la CI : il recopie celui qui
  # existe déjà, depuis un namespace voisin, de nœud à nœud. Idempotent, et sans
  # effet quand le Secret est là.
  #
  # Il vit ici plutôt que dans l'infrastructure parce que c'est ici que le
  # besoin naît : ce site est le seul à tirer une image privée dans un namespace
  # que lui seul occupe.
  amorcer:
    needs: prepare
    if: needs.prepare.outputs.pack == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Préparer la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Garantir le Secret de tirage dans le namespace
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          NS: ${{ needs.prepare.outputs.namespace }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "sh -s $NS" <<'DISTANT'
          set -eu
          NS="$1"

          # helm crée bien le namespace, mais plus tard : le Secret doit y être
          # avant que le premier pod tente son tirage.
          kubectl create namespace "$NS" --dry-run=client -o yaml \
            | kubectl apply -f - >/dev/null

          if kubectl -n "$NS" get secret ghcr-pull >/dev/null 2>&1; then
            echo "ghcr-pull deja present dans $NS"
            exit 0
          fi

          for source in mc-dev mc-prod; do
            if [ "$source" = "$NS" ]; then
              continue
            fi
            if ! kubectl -n "$source" get secret ghcr-pull >/dev/null 2>&1; then
              continue
            fi
            kubectl -n "$source" get secret ghcr-pull \
              -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > /tmp/ghcr-pull.json
            kubectl -n "$NS" create secret generic ghcr-pull \
              --type=kubernetes.io/dockerconfigjson \
              --from-file=.dockerconfigjson=/tmp/ghcr-pull.json \
              --dry-run=client -o yaml | kubectl apply -f - >/dev/null
            rm -f /tmp/ghcr-pull.json
            echo "ghcr-pull recopie depuis $source vers $NS"
            exit 0
          done

          echo "aucun ghcr-pull a recopier : le creer une fois a la main" >&2
          exit 1
          DISTANT

      - run: echo "Secret de tirage garanti dans ${{ needs.prepare.outputs.namespace }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [prepare, amorcer]
    # « always() » avec un contrôle explicite : sans lui, un amorçage sauté —
    # ce qui arrive quand le pack n'est pas publié dans cet environnement —
    # sauterait aussi le déploiement, et la page ne partirait plus du tout.
    if: always() && needs.prepare.result == 'success' && needs.amorcer.result != 'failure'
    uses: samflix-mc/.github/.github/workflows/deploy-helm.yml@main
    with:
      chart-path: chart
      release: mc-launcher-site
      namespace: ${{ needs.prepare.outputs.namespace }}
      environment: ${{ needs.prepare.outputs.environment }}
      set: ${{ needs.prepare.outputs.set }}
      verify-url: ${{ needs.prepare.outputs.url }}
    secrets: inherit
