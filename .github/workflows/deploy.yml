name: Déployer le site

# Correspondance branche → environnement :
#   dev        → dev      (mc-launcher-dev.ggy.info)
#   main       → preprod  (mc-launcher-staging.ggy.info)
#   tag v*     → prod     (mc-launcher.ggy.info)
#
# Le site sert deux choses d'origines différentes : la page, versionnée ici, et
# le pack du launcher, venu de l'image mc-content. Sa version, et le fait même
# de le publier, sont donc choisis ici aussi, environnement par environnement,
# comme le namespace et les hôtes.
#
# Un seul niveau de sous-domaine, et ce n'est pas un choix esthétique : le
# certificat public de Cloudflare ne couvre que « ggy.info » et « *.ggy.info ».
# Tout nom à deux niveaux — preprod.mc-launcher.ggy.info, mc-launcher.staging
# .ggy.info — échoue en TLS côté visiteur, même si le certificat d'origine,
# lui, couvre *.dev et *.staging. Les couvrir au bord demanderait Advanced
# Certificate Manager, payant.
#
# La prod n'est jamais atteinte par un simple push : il faut poser un tag, ce
# que toi seul peux faire. C'est la barrière d'approbation du pauvre, les
# règles de protection d'environnement étant réservées au plan Enterprise.

on:
  push:
    branches: [main, dev]
    paths:
      - "chart/**"
      - ".github/workflows/deploy.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [dev, preprod, prod]
        default: dev

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      namespace: ${{ steps.map.outputs.namespace }}
      set: ${{ steps.map.outputs.set }}
      url: ${{ steps.map.outputs.url }}
    steps:
      - id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            ENV=prod
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            ENV=dev
          else
            ENV=preprod
          fi

          # PACK est le tag de l'image mc-content dont ce site publie
          # /pack/. Il doit désigner, en production, le même tag que
          # « environments.prod.content.tag » dans mc-server : c'est là que se
          # joue la concordance entre ce que le client charge et ce que les
          # serveurs installent. Écrit à la main aux deux endroits plutôt que
          # déduit — une désynchronisation doit se voir en revue, pas se
          # découvrir à la première éjection d'un joueur.
          #
          # Jamais « main » en production : un tag mobile ferait changer le
          # pack au premier redéploiement venu, y compris subi.
          # PACK_ON dit si ce site publie /pack/ dans cet environnement. Les
          # deux « false » ci-dessous ne sont pas des oublis, chacun attend une
          # chose précise :
          #
          #   preprod — le Secret ghcr-pull n'existe pas dans mc-preprod.
          #     L'image mc-content est privée ; sans lui l'initContainer ne
          #     démarre pas et helm --atomic annule tout le déploiement, page
          #     comprise. mc-dev et mc-prod l'ont parce que mc-server y vit ;
          #     mc-preprod n'est occupé que par ce site. Pour l'activer :
          #       kubectl -n mc-preprod create secret docker-registry ghcr-pull \
          #         --docker-server=ghcr.io --docker-username=<user> \
          #         --docker-password=<token>
          #
          #   prod — aucun tag de mc-content ne porte encore launcher/. Le
          #     v0.1.0 est antérieur. Pour l'activer : poser un tag sur
          #     mc-content, le reporter ici en PACK, et le faire correspondre à
          #     environments.prod.content.tag dans mc-server — c'est là que se
          #     joue la concordance entre ce que le client charge et ce que les
          #     serveurs installent.
          #
          # Jamais « main » en production : un tag mobile ferait changer le
          # pack au premier redéploiement venu, y compris subi.
          case "$ENV" in
            dev)
              NS=mc-dev;      HOSTS='{mc-launcher-dev.ggy.info}';     URL=https://mc-launcher-dev.ggy.info
              PACK=main;      PULL=Always;        PACK_ON=true ;;
            preprod)
              NS=mc-preprod;  HOSTS='{mc-launcher-staging.ggy.info}'; URL=https://mc-launcher-staging.ggy.info
              PACK=main;      PULL=Always;        PACK_ON=false ;;
            prod)
              NS=mc-prod; HOSTS='{mc-launcher.ggy.info,mc-luncher.ggy.info}'; URL=https://mc-launcher.ggy.info
              PACK=v0.1.0;    PULL=IfNotPresent;  PACK_ON=false ;;
          esac

          {
            echo "environment=$ENV"
            echo "namespace=$NS"
            echo "set=namespace=$NS,ingress.hosts=$HOSTS,pack.enabled=$PACK_ON,pack.tag=$PACK,pack.pullPolicy=$PULL"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"
          if [ "$PACK_ON" = true ]; then
            echo "→ $ENV · namespace $NS · $URL · pack mc-content:$PACK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "→ $ENV · namespace $NS · $URL · pack NON publié ici" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: prepare
    uses: samflix-mc/.github/.github/workflows/deploy-helm.yml@main
    with:
      chart-path: chart
      release: mc-launcher-site
      namespace: ${{ needs.prepare.outputs.namespace }}
      environment: ${{ needs.prepare.outputs.environment }}
      set: ${{ needs.prepare.outputs.set }}
      verify-url: ${{ needs.prepare.outputs.url }}
    secrets: inherit
