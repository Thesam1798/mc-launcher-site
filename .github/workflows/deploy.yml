name: Déployer le site

# La correspondance référence → environnement n'est plus ici : elle est dans
# environnements.yaml, au dépôt .github, avec celle des autres dépôts.
#
#   main    → dev
#   dispatch → preprod
#   tag v*  → prod
#
# Ce n'est plus tout à fait ce qu'elle était ici : « main » déployait la
# préproduction, et une branche « dev » la dev. La règle est désormais la même
# pour les quatre dépôts — pousser sur main avait quatre effets différents selon
# le dépôt, ce qui n'aide personne. La préproduction se demande, parce qu'une
# répétition se décide.
#
# La prod n'est jamais atteinte par un push : il faut poser un tag, ce que toi
# seul peux faire. C'est la barrière d'approbation du pauvre, les règles de
# protection d'environnement étant réservées au plan Enterprise.
#
# Les hôtes, le namespace, et le fait même de publier /pack/ viennent tous de la
# table. Un seul niveau de sous-domaine, et ce n'est pas un choix esthétique :
# le certificat public de Cloudflare ne couvre que « ggy.info » et
# « *.ggy.info ».

on:
  push:
    branches: [main]
    paths:
      - "chart/**"
      - "src/**"
      - ".github/workflows/deploy.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement cible
        type: choice
        options: [dev, preprod, prod]
        default: preprod

jobs:
  env:
    uses: samflix-mc/.github/.github/workflows/resoudre-env.yml@main
    with:
      environnement: ${{ inputs.environnement }}

  # La page est construite ici, et plus à la main avant de committer.
  #
  # chart/files/ était versionné, et rien ne garantissait qu'il corresponde à
  # src/ : le déclencheur ne regardait même pas src/, donc modifier le gabarit
  # sans relancer la construction ne déployait rien, en silence.
  construire:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Construire la page
        working-directory: src
        run: |
          pnpm install --frozen-lockfile
          node build.mjs

      - name: Vérifier que la construction a produit quelque chose
        run: |
          # Un chart sans page rend un ConfigMap vide et un site en 404, sans
          # que rien n'échoue : le pod démarre, les sondes passent, et /health
          # répond. Mieux vaut s'arrêter ici.
          [ -f chart/files/index.html ] || { echo "::error::index.html manquant après construction"; exit 1; }
          ls -l chart/files >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: chart
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [env, construire]
    uses: samflix-mc/.github/.github/workflows/deploy-helm.yml@main
    with:
      chart-path: chart
      release: mc-launcher-site
      namespace: ${{ needs.env.outputs.namespace }}
      environment: ${{ needs.env.outputs.environnement }}
      artefact-chart: chart
      set: >-
        namespace=${{ needs.env.outputs.namespace }},ingress.hosts=${{ needs.env.outputs.site-hotes }},pack.enabled=${{ needs.env.outputs.site-pack }},pack.tag=${{ needs.env.outputs.contenu-tag }},pack.pullPolicy=${{ needs.env.outputs.contenu-pull }}
      verify-url: ${{ needs.env.outputs.site-url }}
      # L'image de contenu est privée, et son tirage s'autorise par un Secret
      # qui vit dans le namespace. Inutile de l'exiger là où le pack n'est pas
      # publié : le chart n'y tire alors aucune image privée.
      pull-secret: ${{ needs.env.outputs.site-pack == 'true' && needs.env.outputs.pull-secret || '' }}
    secrets: inherit

  # Le pack est servi depuis l'image de contenu, pas depuis ce dépôt. Une page
  # qui répond 200 ne dit donc rien de lui.
  verifier-pack:
    needs: [env, deploy]
    if: needs.env.outputs.site-pack == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Le pack est-il servi, et frais ?
        run: |
          set -eu
          base="${{ needs.env.outputs.site-url }}/pack"
          mauvais=0

          {
            echo "| fichier | code | cache-control | octets |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in samflix.json samflix.lock.json; do
            entetes=$(curl -sS -D - -o "/tmp/$f" -m 20 "$base/$f")
            code=$(printf '%s' "$entetes" | head -1 | awk '{print $2}')
            cache=$(printf '%s' "$entetes" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2- || echo '(absent)')
            taille=$(wc -c < "/tmp/$f")
            echo "| \`$f\` | $code | \`$cache\` | $taille |" >> "$GITHUB_STEP_SUMMARY"

            [ "$code" = 200 ] || { echo "::error::$base/$f répond $code"; mauvais=1; }

            # Un pack mis en cache est un pack périmé, et un pack périmé coûte
            # une éjection à la connexion. Ce dépôt a déjà vu un 403 transitoire
            # rester un an dans le cache de Cloudflare — le CSS s'en protège par
            # son nom haché, le pack ne le peut pas : il garde le même nom à vie,
            # c'est ce qui permet au launcher d'aller le chercher sans rien
            # savoir.
            case "$cache" in
              *no-cache*) ;;
              *) echo "::error::$f est servi avec « $cache » au lieu de no-cache"; mauvais=1 ;;
            esac
          done

          [ "$mauvais" = 0 ]
