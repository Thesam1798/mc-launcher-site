apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-launcher-site
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mc-launcher-site.labels" . | nindent 4 }}
    {{- include "mc-launcher-site.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "mc-launcher-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Redéploie le pod dès que le contenu change, sinon le ConfigMap monté
        # met plusieurs minutes à se propager.
        checksum/config: {{ .Files.Glob "files/*" | toYaml | sha256sum }}
      labels:
        {{- include "mc-launcher-site.labels" . | nindent 8 }}
        {{- include "mc-launcher-site.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: static-web-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: SERVER_ROOT
              value: /public
            - name: SERVER_PORT
              value: "8080"
            # Pas de listing : le site n'expose qu'une page.
            - name: SERVER_DIRECTORY_LISTING
              value: "false"
            - name: SERVER_HEALTH
              value: "true"
            - name: SERVER_LOG_LEVEL
              value: "info"
            # Vraie IP visiteur derrière Cloudflare puis Traefik.
            - name: SERVER_LOG_FORWARDED_FOR
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Chaque fichier est monté en subPath, ce qui produit de vrais
          # fichiers. Un montage de ConfigMap classique crée des liens
          # symboliques vers ..data/, et static-web-server refuse de les servir
          # : /  répondait 200 (chemin de l'index de répertoire) mais
          # /index.html et /style.css répondaient 403.
          volumeMounts:
          {{- range $path, $_ := .Files.Glob "files/*" }}
            - name: site
              mountPath: /public/{{ base $path }}
              subPath: {{ base $path }}
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: site
          configMap:
            name: mc-launcher-site
