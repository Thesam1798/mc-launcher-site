apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-launcher-site
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mc-launcher-site.labels" . | nindent 4 }}
    {{- include "mc-launcher-site.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "mc-launcher-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Redéploie le pod dès que la page change, sinon le ConfigMap monté met
        # plusieurs minutes à se propager. Le pack, lui, ne passe pas par le
        # ConfigMap : il vient de l'image mc-content, et c'est la CI de
        # mc-content qui redémarre ce déploiement quand elle en publie une.
        checksum/config: {{ .Files.Glob "files/*" | toYaml | sha256sum }}
      labels:
        {{- include "mc-launcher-site.labels" . | nindent 8 }}
        {{- include "mc-launcher-site.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      {{- if and .Values.pack.enabled .Values.pack.pullSecret }}
      # L'image de contenu est privée. Le Secret est créé hors chart, une fois
      # par namespace — le même que celui de mc-server, qui vit dans ces mêmes
      # namespaces.
      imagePullSecrets:
        - name: {{ .Values.pack.pullSecret }}
      {{- end }}
      {{- if .Values.pack.enabled }}
      # Le pack du launcher n'est pas versionné ici : il est décidé dans
      # mc-content, aux côtés des listes que reçoivent les serveurs, et
      # transporté par la même image. Un initContainer l'en extrait, exactement
      # comme le fait le chart mc-server pour les mods et les plugins.
      #
      # Recopié dans un emptyDir plutôt que monté directement : l'image ne
      # tourne pas, elle transporte, et le conteneur qui sert les fichiers doit
      # pouvoir démarrer et vivre sans elle.
      initContainers:
        - name: pack
          image: "{{ .Values.pack.image }}:{{ .Values.pack.tag }}"
          imagePullPolicy: {{ .Values.pack.pullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              # Échouer ici plutôt que servir un 404 : un pack absent rendrait
              # « mc-pack install » impossible pour tout le monde, et le pod
              # passerait pourtant pour sain. Mieux vaut un CrashLoopBackOff,
              # qui se voit.
              if [ ! -d /content/launcher ]; then
                echo "l'image de contenu ne porte pas /content/launcher" >&2
                exit 1
              fi
              cp -f /content/launcher/*.json /pack/
              echo "pack mc-content $(cat /content/VERSION 2>/dev/null || echo inconnu) en place :"
              ls -l /pack
          volumeMounts:
            - name: pack
              mountPath: /pack
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      {{- end }}
      containers:
        - name: static-web-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: SERVER_ROOT
              value: /public
            - name: SERVER_PORT
              value: "8080"
            # Pas de listing : le site n'expose qu'une page.
            - name: SERVER_DIRECTORY_LISTING
              value: "false"
            - name: SERVER_HEALTH
              value: "true"
            - name: SERVER_LOG_LEVEL
              value: "info"
            # Vraie IP visiteur derrière Cloudflare puis Traefik.
            - name: SERVER_LOG_FORWARDED_FOR
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Chaque fichier est monté en subPath, ce qui produit de vrais
          # fichiers. Un montage de ConfigMap classique crée des liens
          # symboliques vers ..data/, et static-web-server refuse de les servir
          # : /  répondait 200 (chemin de l'index de répertoire) mais
          # /index.html et /style.css répondaient 403.
          volumeMounts:
          {{- range $path, $_ := .Files.Glob "files/*" }}
            - name: site
              mountPath: /public/{{ base $path }}
              subPath: {{ base $path }}
              readOnly: true
          {{- end }}
          {{- if .Values.pack.enabled }}
            # Un répertoire entier, et non des subPath comme la page : son
            # contenu vient de l'image et n'est pas connu du chart. Ce sont de
            # vrais fichiers, pas les liens vers ..data/ que static-web-server
            # refuse de servir.
            - name: pack
              mountPath: /public/pack
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: site
          configMap:
            name: mc-launcher-site
        {{- if .Values.pack.enabled }}
        - name: pack
          emptyDir: {}
        {{- end }}
