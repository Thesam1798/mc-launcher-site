# L'IngressRoute vit dans le namespace de l'application, pas dans celui de
# Traefik. La convention du cluster est l'inverse, mais elle ne tient pas en
# multi-environnement : le nom de la ressource serait identique pour dev,
# preprod et prod dans un namespace partagé, et Helm refuse qu'une release
# s'approprie une ressource détenue par une autre.
#
# Traefik est configuré avec kubernetesCRD sans restriction de namespace et
# allowCrossNamespace, il la voit donc ici et peut pointer vers le middleware
# resté dans traefik-system.
#
# Trois routes pour un seul backend. Elles ne servent qu'à décider du
# « cache-control », que static-web-server choisit sinon sur la seule extension
# du fichier — voir middlewares-cache.yaml.
#
# Aucune priorité n'est posée : Traefik classe par longueur de rule
# décroissante, et les deux routes spécifiques sont la règle générale plus un
# « && PathPrefix(…) ». L'écart est constant, et la liste d'hôtes est la même
# pour les trois : ajouter un hôte à un environnement allonge les trois
# règles d'autant et ne peut pas renverser l'ordre.
{{- $hotes := printf "Host(`%s`)" (join "`) || Host(`" .Values.ingress.hosts) }}
{{- $securite := .Values.securityHeaders }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mc-launcher-site
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mc-launcher-site.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    {{- if .Values.pack.enabled }}
    # Le pack ne doit jamais être servi depuis un cache : il garde le même nom
    # à vie — c'est ce qui permet au launcher d'aller le chercher sans rien
    # savoir — et un pack périmé fait installer au joueur des versions que les
    # serveurs n'ont plus. Les registres NeoForge ne concordent alors pas à la
    # connexion, et il est éjecté avec un message qui ne dit pas pourquoi.
    - kind: Rule
      match: {{ printf "(%s) && PathPrefix(`/pack/`)" $hotes }}
      middlewares:
        - name: {{ $securite.middlewareName }}
          namespace: {{ $securite.middlewareNamespace }}
        - name: mc-launcher-site-sans-cache
          namespace: {{ .Values.namespace }}
      services:
        - name: mc-launcher-site
          namespace: {{ .Values.namespace }}
          port: 80
    {{- end }}
    # Le CSS, et lui seul, porte son empreinte dans son nom : src/build.mjs
    # l'écrit en « style.<empreinte>.css » et supprime l'ancien. Une URL qui
    # change avec le contenu peut être gardée pour toujours.
    - kind: Rule
      match: {{ printf "(%s) && PathPrefix(`/style.`)" $hotes }}
      middlewares:
        - name: {{ $securite.middlewareName }}
          namespace: {{ $securite.middlewareNamespace }}
        - name: mc-launcher-site-immuable
          namespace: {{ .Values.namespace }}
      services:
        - name: mc-launcher-site
          namespace: {{ .Values.namespace }}
          port: 80
    # Tout le reste — la page, et les erreurs. Site public : en-têtes de
    # sécurité uniquement, aucune authentification.
    - kind: Rule
      match: {{ $hotes }}
      middlewares:
        - name: {{ $securite.middlewareName }}
          namespace: {{ $securite.middlewareNamespace }}
        - name: mc-launcher-site-sans-cache
          namespace: {{ .Values.namespace }}
      services:
        - name: mc-launcher-site
          namespace: {{ .Values.namespace }}
          port: 80
  tls: {}
