# Qui a le droit d'être mis en cache, et qui ne l'a pas.
#
# static-web-server pose un « cache-control » d'office, choisi sur la seule
# extension du fichier et sans distinguer une réponse saine d'une erreur. Ce
# dépôt en garde déjà la trace : un 403 transitoire sur /style.css s'est
# retrouvé mis en cache un an par Cloudflare.
#
# La règle est donc inversée : rien n'est mis en cache, sauf ce dont le nom
# garantit qu'il ne changera jamais. C'est le seul critère qui tienne — un
# fichier dont l'URL change avec le contenu peut être gardé pour toujours,
# tous les autres doivent être revalidés.
#
# La revalidation ne coûte pas un téléchargement : static-web-server envoie un
# « last-modified », et une réponse inchangée se solde par un 304 vide.
{{- $labels := include "mc-launcher-site.labels" . }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mc-launcher-site-sans-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      # « no-cache » et non « no-store » : la réponse peut être conservée, elle
      # doit seulement être revalidée avant usage.
      Cache-Control: "no-cache"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mc-launcher-site-immuable
  namespace: {{ .Values.namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      # Réservé aux fichiers nommés d'après leur empreinte, par src/build.mjs.
      # « immutable » dispense le navigateur de la requête de revalidation que
      # « max-age » seul ne lui épargne pas lors d'un rechargement de page.
      Cache-Control: "public, max-age=31536000, immutable"
