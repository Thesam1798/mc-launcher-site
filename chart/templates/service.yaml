apiVersion: v1
kind: Service
metadata:
  name: mc-launcher-site
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mc-launcher-site.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mc-launcher-site.selectorLabels" . | nindent 4 }}
