# =============================================================================
# mc-launcher-site — page de présentation, et pack servi aux launchers
# =============================================================================
# Chart volontairement séparé de samflix-media : ce site n'a aucun rapport avec
# la stack média, il ne partage ni son namespace, ni son cycle de vie, ni ses
# volumes. Le seul point commun est l'ingress Traefik du cluster.
#
# Deux choses sont servies, et elles n'ont pas la même origine :
#   /            la page, versionnée dans ce dépôt (chart/files, ConfigMap)
#   /pack/       le pack du launcher, venu de l'image mc-content
# =============================================================================

namespace: mc-launcher
traefikNamespace: traefik-system

# Middleware d'en-têtes de sécurité déployé par samflix-infra.
securityHeaders:
  middlewareName: security-headers
  middlewareNamespace: traefik-system

ingress:
  # Les deux orthographes sont routées : le DNS de ggy.info est joker, les deux
  # résolvent, et « luncher » est une faute fréquente sur « launcher ».
  hosts:
    - mc-launcher.ggy.info
    - mc-luncher.ggy.info

image:
  # static-web-server : binaire Rust statique, image scratch (~3,6 Mo), pas de
  # shell. Même image et même version que le composant public-share du chart
  # média — épinglée volontairement, jamais :latest.
  repository: ghcr.io/static-web-server/static-web-server
  tag: "2.43.0"

# Pack du launcher — la liste de mods que les joueurs installent.
#
# Il n'est pas versionné ici : il vient de mc-content, où il voisine avec les
# listes que reçoivent les serveurs. C'est tout l'intérêt — les registres
# NeoForge sont négociés à la connexion, et un mod en version différente entre
# le client et le serveur éjecte le joueur sans message exploitable. Une seule
# décision, deux consommateurs : le chart mc-server et celui-ci.
#
# Le transport est le même que pour les serveurs : un initContainer monte
# l'image de contenu et recopie /content/launcher dans un emptyDir que
# static-web-server publie sous /pack/.
pack:
  enabled: true
  image: ghcr.io/samflix-mc/mc-content
  # Valeur par défaut, celle de dev : suit la branche main de mc-content, dont
  # la CI fait recharger ce déploiement à chaque publication.
  #
  # Le tag réel vient de environnements.yaml, au dépôt .github — le même fichier
  # qui le donne à mc-server. Il était auparavant recopié à la main ici et
  # là-bas, sans que rien ne vérifie qu'ils concordaient, alors que c'est cette
  # concordance qui décide si un joueur entre dans la partie.
  #
  # Jamais « main » en prod : un tag mobile ferait changer le pack au premier
  # redéploiement venu, y compris subi, sans que personne ne l'ait décidé.
  tag: main
  # Always est nécessaire tant que le tag est mutable : la politique par défaut
  # d'un tag autre que « latest » est IfNotPresent, et le nœud conserverait
  # indéfiniment la première image tirée. Un pack republié sous « main » ne
  # serait jamais repris, sans le moindre message.
  pullPolicy: Always
  # Le dépôt mc-content est privé, son image l'est aussi. Le Secret est créé
  # hors chart, une fois par namespace — le même que celui de mc-server, qui
  # vit dans ces mêmes namespaces.
  pullSecret: ghcr-pull

replicas: 1

resources:
  requests:
    cpu: 5m
    memory: 12Mi
  limits:
    memory: 48Mi

